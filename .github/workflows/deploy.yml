name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

# Cancel in-flight workflows for the same branch/PR when new commits are pushed
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Security hardening: read-only permissions for repository contents
permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. CI JOB: Code Validation, Type Safety, Linting & Production Build
  # =========================================================================
  ci:
    uses: ./.github/workflows/ci.yml
    
  # =========================================================================
  # 2. DATABASE CI JOB: Validate Migrations Locally
  # =========================================================================
  db-migrations:
    uses: ./.github/workflows/database.yml

  # =========================================================================
  # 3. CD JOB: Deploy Migrations to STAGING
  # =========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    needs:
      - ci
      - db-migrations

    # Only deploy when code is pushed to staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    # Uses secrets and variables from the staging environment
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Deploy Migrations to Staging
        run: |
          supabase link --project-ref "$PROJECT_REF"

          echo "Running pre-migration check for staging (dry-run)"
          supabase db push --dry-run --include-all --linked

          echo "Deploying migrations to staging"
          supabase db push --include-all --linked --yes
        env:
          PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build & Deploy Worker to Staging
        run: |
          npx opennextjs-cloudflare build
          node scripts/patch-worker.mjs
          npx wrangler deploy --env staging
        env:
          NEXT_PUBLIC_APP_ENV: ${{ vars.NEXT_PUBLIC_APP_ENV }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Placeholders for server-only SDK constructors evaluated during next build
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-ci-service-role-key"
          SUPABASE_STORAGE_BUCKET: "sanad-file-storage"
          WIDGET_SESSION_SECRET: "placeholder-session-secret-min-32-chars-long"
          LLAMA_INDEX_API_KEY: "placeholder-llama-key"
          GROQ_API_KEY: "placeholder-groq-key"
          OPENROUTER_API_EMBEDDING_KEY: "placeholder-openrouter-key"
          CLOUDFLARE_AI_API_TOKEN: "placeholder-cf-ai-token"
          CF_EMBEDDING_MODEL: "@cf/baai/bge-m3"
          LLM_API_KEY: "placeholder-llm-key"
          LLM_BASE_URL: "https://backend.placeholder.com/v1"

  # =========================================================================
  # 4. CD JOB: Deploy Migrations to PRODUCTION
  # =========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    needs:
      - ci
      - db-migrations

    # Only deploy when code is pushed to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Uses secrets and variables from the production environment.
    # GitHub requires approval here if you configured required reviewers.
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Deploy Migrations to Production
        run: |
          supabase link --project-ref "$PROJECT_REF"

          echo "Running pre-migration check for production (dry-run)"
          supabase db push --dry-run --include-all --linked

          echo "Deploying migrations to production"
          supabase db push --include-all --linked --yes
        env:
          PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build & Deploy Worker to Production
        run: |
          npx opennextjs-cloudflare build
          node scripts/patch-worker.mjs
          npx wrangler deploy --env production
        env:
          NEXT_PUBLIC_APP_ENV: ${{ vars.NEXT_PUBLIC_APP_ENV }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Placeholders for server-only SDK constructors evaluated during next build
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-ci-service-role-key"
          SUPABASE_STORAGE_BUCKET: "sanad-file-storage"
          WIDGET_SESSION_SECRET: "placeholder-session-secret-min-32-chars-long"
          LLAMA_INDEX_API_KEY: "placeholder-llama-key"
          GROQ_API_KEY: "placeholder-groq-key"
          OPENROUTER_API_EMBEDDING_KEY: "placeholder-openrouter-key"
          CLOUDFLARE_AI_API_TOKEN: "placeholder-cf-ai-token"
          CF_EMBEDDING_MODEL: "@cf/baai/bge-m3"
          LLM_API_KEY: "placeholder-llm-key"
          LLM_BASE_URL: "https://backend.placeholder.com/v1"
