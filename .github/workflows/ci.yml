name: Validate Application

on:
  workflow_call:

# Security hardening: read-only permissions for repository contents
permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. CI JOB: Code Validation, Type Safety, Linting & Production Build
  # =========================================================================
  ci:
    name: Validate Application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Clone the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime with npm package cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 3: Clean, deterministic install from package-lock.json
      - name: Install Dependencies
        run: npm ci
        
      # Step 4: Restore Next.js / Turbopack build cache across CI runs
      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # Step 5: Verify TypeScript types without emitting JavaScript
      - name: TypeScript Check
        run: npx tsc --noEmit
      
      # Step 6: Run ESLint to enforce code standards and React Compiler rules
      - name: Run ESLint
        run: npm run lint

      # Step 7: Audit High Level CVEs for dependencies (production dependencies only)
      - name: Security Audit For Dependencies
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      # Step 7: Test production build and static page generation
            # Step 8: Test production build and static page generation
      - name: Build Next.js Application
        run: npm run build
        env:
          # Supabase
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-ci.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder-ci-publishable-key"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-ci-service-role-key"
          SUPABASE_STORAGE_BUCKET: "sanad-file-storage"

          # Security
          WIDGET_SESSION_SECRET: "placeholder-session-secret-min-32-chars-long"

          # AI & Parsing SDKs (لتجاوز فحص الـ Constructors عند بدء التشغيل)
          LLAMA_INDEX_API_KEY: "placeholder-llama-key"
          GROQ_API_KEY: "placeholder-groq-key"
          OPENROUTER_API_EMBEDDING_KEY: "placeholder-openrouter-key"
          CLOUDFLARE_API_TOKEN: "placeholder-cf-token"
          CLOUDFLARE_ACCOUNT_ID: "placeholder-cf-account"
          CF_EMBEDDING_MODEL: "@cf/baai/bge-m3"
          LLM_API_KEY: "placeholder-llm-key"
          LLM_BASE_URL: "https://backend.placeholder.com/v1"



